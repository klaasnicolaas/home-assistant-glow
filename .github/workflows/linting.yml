---
name: Linting

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
    paths:
      - "**.yaml"
      - "**.yml"

permissions:
  contents: read

jobs:
  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1
      - name: 🚀 Run yamllint
        run: yamllint --strict .
