---
# Build & Deploy the ESPHome firmwares for the Home Assistant Glow project.
name: Deploy firmware

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release-url:
        description: "Release URL"
        required: true
        type: string
      release-summary:
        description: "Release summary/notes"
        required: false
        type: string

jobs:
  build-firmware:
    name: Build firmware
    uses: klaasnicolaas/home-assistant-glow/.github/workflows/build-firmware.yaml@4119c65276416c920b7313f1e18eee2c21ac7c29 # main
    with:
      release-url: ${{ github.event.release.html_url || inputs.release-url }}
      release-summary: ${{ github.event.release.body || inputs.release-summary }}

  combined-manifests:
    name: Organize ${{ matrix.folder }} firmware
    runs-on: ubuntu-latest
    needs: build-firmware
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            folder: home-assistant-glow
            name: Home Assistant Glow
            pattern: build-glow-standard-*
          - variant: basic
            folder: glow-basic
            name: Glow Basic
            pattern: build-glow-basic-*
    steps:
      - name: ⤵️ Download variant artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ matrix.pattern }}
          merge-multiple: true
          path: ${{ matrix.folder }}
      - name: 🔨 Generate combined manifest
        run: |
          cd ${{ matrix.folder }}
          version=$(cat */project_version | head -n 1)

          jq -s --arg name "${{ matrix.name }}" --arg version "$version" '{
            name: $name,
            version: $version,
            home_assistant_domain: "esphome",
            builds: .
          }' */manifest.json > manifest.json
      - name: 🧪 Display structure
        run: ls -R ${{ matrix.folder }}
      - name: ⬆️ Upload organized artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.folder }}
          path: ${{ matrix.folder }}
          retention-days: 1

  build-docs:
    name: Build documentation
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    needs: combined-manifests
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ⬇️ Download firmware artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*glow*"
          path: docs/static
      - name: 🧪 Display structure of job
        run: ls -R docs/static
      - name: 🏗️ Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: 🏗️ Install Docusaurus dependencies
        run: npm ci
        working-directory: docs
      - name: 🚀 Build Docusaurus
        run: npm run build
        working-directory: docs
      - name: ⬆️ Upload pages artifacts
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/build

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-docs
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🏗️ Setup Github Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: 🚀 Deploy to Github Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment

  bluesky:
    name: 🦋 Post to Bluesky
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: release
    needs: deploy
    permissions: {}
    steps:
      - uses: myConsciousness/bluesky-post@v5
        with:
          text: |
            ⬆️ ${{ github.event.release.tag_name }} of ${{ github.event.repository.name }} is out 🎉 #update @klaasnicolaas.nl @home-assistant.io #glow #energy #esphome #release

            Check out the release notes here: ${{ github.event.release.html_url }}
          identifier: ${{ secrets.BLUESKY_IDENTIFIER }}
          password: ${{ secrets.BLUESKY_PASSWORD }}
