---
# Build ESPHome firmwares for the Home Assistant Glow project.
name: Build firmware

on:
  push:
    branches:
      - develop
      - release/**
    paths:
      - home-assistant-glow/**
      - glow-basic/**
      - components/**
      - .github/workflows/**
  workflow_dispatch:
  workflow_call:
    inputs:
      release-url:
        required: true
        type: string
      release-summary:
        required: false
        type: string
        default: "Check the release notes for more information."
  pull_request:
    branches-ignore:
      - renovate/docusaurus**
    paths:
      - home-assistant-glow/**
      - glow-basic/**
      - components/**
      - .github/workflows/**
  # Every Monday at 4:00 UTC
  schedule:
    - cron: "0 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/latest

jobs:
  prepare:
    name: Prepare build
    runs-on: ubuntu-latest
    outputs:
      substitutions: ${{ steps.package-source.outputs.substitutions }}
    steps:
      - name: 🔍 Set ESPHome package source for dev/PR builds
        id: package-source
        if: ${{ !contains(fromJSON('["release", "workflow_call"]'), github.event_name) }}
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$PR_HEAD_REPO" != "$REPO" ] && [ -n "$PR_HEAD_REPO" ]; then
            PACKAGE_URL="https://github.com/${PR_HEAD_REPO}/"
          else
            PACKAGE_URL="https://github.com/${REPO}/"
          fi
          if [ -n "$PR_NUMBER" ]; then
            PROJECT_VERSION="pr-${PR_NUMBER}"
          else
            PROJECT_VERSION="dev-${GITHUB_SHA::7}"
          fi
          {
            echo "substitutions<<EOF"
            echo "package_url=${PACKAGE_URL}"
            echo "package_ref=${HEAD_REF}"
            echo "project_version=${PROJECT_VERSION}"
            echo "EOF"
          } >> $GITHUB_OUTPUT

  build:
    name: ${{ matrix.device }} / ${{ matrix.variant }}
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      max-parallel: 5
      fail-fast: false
      matrix:
        device: [esp32, esp32c3, esp8266]
        variant: [standard, basic]
        include:
          - variant: standard
            folder: home-assistant-glow
          - variant: basic
            folder: glow-basic
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.0
      - name: 🔨 Build firmware
        uses: esphome/build-action@v7.3.0
        id: esphome-build
        with:
          yaml-file: ${{ matrix.folder }}/${{ matrix.device }}.yaml
          version: latest
          release-summary: ${{ inputs.release-summary || 'Check the release notes for more information.' }}
          release-url: ${{ inputs.release-url || env.RELEASE_URL }}
          substitutions: ${{ needs.prepare.outputs.substitutions }}
      - name: 🚚 Prepare output artifacts
        run: |
          set -e
          mkdir -p output/${{ matrix.device }}
          mv ${{ steps.esphome-build.outputs.name }}/* output/${{ matrix.device }}/
          echo "${{ steps.esphome-build.outputs.version }}" > output/${{ matrix.device }}/version
          echo "${{ steps.esphome-build.outputs.project-version }}" > output/${{ matrix.device }}/project_version
          sed -i "s|${{ steps.esphome-build.outputs.name }}\(\.[a-z]*\)\.bin|/${{ matrix.folder }}/${{ matrix.device }}/${{ steps.esphome-build.outputs.name }}\1.bin|" output/${{ matrix.device }}/manifest.json
          jq --arg variant "${{ matrix.variant }}" '. + {variant: $variant}' output/${{ matrix.device }}/manifest.json > output/${{ matrix.device }}/manifest.json.tmp
          mv output/${{ matrix.device }}/manifest.json.tmp output/${{ matrix.device }}/manifest.json

      - name: ⬆️ Upload firmware artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-glow-${{ matrix.variant }}-${{ matrix.device }}
          path: output
          retention-days: 7

  comment:
    name: Comment on PR
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: [prepare, build]
    permissions:
      pull-requests: write
    steps:
      - name: 💬 Comment on PR
        uses: actions/github-script@v9.0.0
        with:
          script: |
            // Get all artifacts from this workflow run
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });

            let comment = '## 🎉 Firmware built successfully!\n\n';
            comment += 'Download the firmware for your device and flash it using [ESPHome Web](https://web.esphome.io):\n\n';

            // Collect artifacts by device and variant
            const devices = {};
            artifacts.data.artifacts.forEach(artifact => {
              if (artifact.name.startsWith('build-glow-')) {
                // Artifact name format: build-glow-{variant}-{device}
                const parts = artifact.name.replace('build-glow-', '').split('-');
                const variant = parts[0];
                const device = parts.slice(1).join('-');
                const downloadUrl = `${context.payload.repository.html_url}/actions/runs/${context.runId}/artifacts/${artifact.id}`;
                if (!devices[device]) devices[device] = {};
                devices[device][variant] = downloadUrl;
              }
            });

            // Build markdown table
            comment += '| Device | Standard | Basic |\n';
            comment += '|--------|----------|-------|\n';
            for (const [device, variants] of Object.entries(devices)) {
              const standard = variants.standard ? `[Download](${variants.standard})` : '-';
              const basic = variants.basic ? `[Download](${variants.basic})` : '-';
              comment += `| **${device}** | ${standard} | ${basic} |\n`;
            }

            comment += '\n### 📝 Installation instructions\n';
            comment += '1. Download and extract the ZIP file for your device\n';
            comment += '2. Use the **factory.bin** file for a fresh install via [ESPHome Web](https://web.esphome.io)\n';
            comment += '3. For OTA updates, you can use the other `.bin` files\n';

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
